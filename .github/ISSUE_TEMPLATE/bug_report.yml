name: Bug report
description: Report a reproducible problem.
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include example inputs, omitting private information.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
  - type: textarea
    id: additional
    attributes:
      label: Additional context
